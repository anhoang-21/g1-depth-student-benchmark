seed: 42
device: cuda:0
num_steps_per_env: 24
init_at_random_ep_len: true
max_iterations: 2750
obs_groups:
  student:
  - proprio_history
  - depth
  teacher:
  - proprio
  - height_scan
clip_actions: null
check_for_nan: true
save_interval: 250
experiment_name: g1_rough_depth_student
run_name: ''
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: C:\Users\ADMIN\Isaacsim\IsaacLab\logs\rsl_rl\g1_rough_depth_student\2026-11-15_17-48-55\model_21250.pt
class_name: DistillationRunner
student:
  class_name: CNNModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.1
    std_type: scalar
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
  cnn_cfg:
    output_channels:
    - 16
    - 32
    - 32
    kernel_size:
    - 5
    - 3
    - 3
    stride:
    - 2
    - 2
    - 2
    dilation: 1
    padding: zeros
    norm: none
    activation: relu
    max_pool: false
    global_pool: none
    flatten: true
teacher:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.0
    std_type: scalar
    std_range: !!python/tuple
    - 1.0e-06
    - 1000000.0
algorithm:
  class_name: isaaclab_tasks.core.velocity.config.g1.agents.distillation:MirrorDistillation
  num_learning_epochs: 2
  learning_rate: 0.001
  gradient_length: 15
  max_grad_norm: 1.0
  optimizer: adam
  loss_type: mse
